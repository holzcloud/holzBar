included:
  - holzBar
  - NowPlayingRemote

disabled_rules:
  - cyclomatic_complexity
  - file_length
  - function_body_length
  - function_parameter_count
  - generic_type_name
  - identifier_name
  - large_tuple
  - line_length
  - nesting
  - opening_brace
  - todo
  - type_body_length

opt_in_rules:
  - accessibility_label_for_image
  - accessibility_trait_for_button
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - convenience_type
  - discouraged_object_literal
  - empty_count
  - fatal_error_message
  - file_header
  - force_unwrapping
  - implicitly_unwrapped_optional
  - indentation_width
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_arguments_brackets
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - period_spacing
  - unavailable_function
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - yoda_condition

custom_rules:
  objc_dynamic:
    name: "@objc dynamic"
    message: "`dynamic` modifier should immediately follow `@objc` attribute"
    regex: '@objc\b(\(\w*\))?+\s*(\S+|\v+\S*)\s*\bdynamic'
    match_kinds: attribute.builtin
  prefer_spaces_over_tabs:
    name: Prefer Spaces Over Tabs
    message: "Indentation should use 4 spaces per indentation level instead of tabs"
    regex: ^\t
  # The design system: views take every font, colour and radius from `HolzBarTheme`, which
  # lives in `UI/Design/` and is the only place a raw value may be written.
  design_raw_font:
    name: Raw system font
    message: "Use a `HolzBarTheme.Typography` token instead of a fixed-size system font"
    regex: '\.font\(\s*\.system\('
    excluded: ".*/UI/Design/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    severity: error
  design_raw_color:
    name: Raw colour
    message: "Use a `HolzBarTheme.Palette` colour instead of a colour literal"
    regex: '\bColor\(\s*(?:red|white|hue|\.sRGB|\.displayP3|\.sRGBLinear|\.genericGamma22Gray|")'
    excluded: ".*/UI/Design/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    severity: error
  design_corner_radius:
    name: Raw corner radius
    message: "Use `HolzBarTheme.shape(_:)` with a `HolzBarTheme.Radius` token instead of `.cornerRadius(`"
    regex: '\.cornerRadius\('
    excluded: ".*/UI/Design/.*"
    excluded_match_kinds:
      - comment
      - doccomment
    severity: error
  # The settings kit: Settings screens (the Settings folders, including the What's New window,
  # the Appearance editor and the hub modules' settings views) use only the kit in
  # `UI/Design/SettingsKit/`. The first-launch Permissions window is a separate window.
  design_settings_raw_radius:
    name: Raw radius in a Settings screen
    message: "Use a settings kit part or `HolzBarTheme.shape(_:)` with a `HolzBarTheme.Radius` token instead of a number"
    regex: '(?:\bRoundedRectangle|\.rect)\(\s*cornerRadius:\s*[0-9]'
    included:
      - '.*/holzBar/Settings/.*'
      - '.*/holzBar/MenuBar/Appearance/MenuBarAppearanceEditor/.*'
      - '.*/holzBar/MenuBar/NotchHub/[^/]+/[^/]*SettingsView\.swift'
    excluded: '.*/UI/Design/.*|.*/holzBar/Permissions/.*'
    excluded_match_kinds:
      - comment
      - doccomment
    severity: error
  design_settings_toggle_style:
    name: Hand-set toggle style in a Settings screen
    message: "The settings kit sets the one mini switch: use `SettingsToggleRow` or `SettingsSwitch` instead of setting a toggle style by hand"
    regex: '\.toggleStyle\('
    included:
      - '.*/holzBar/Settings/.*'
      - '.*/holzBar/MenuBar/Appearance/MenuBarAppearanceEditor/.*'
      - '.*/holzBar/MenuBar/NotchHub/[^/]+/[^/]*SettingsView\.swift'
    excluded: '.*/UI/Design/.*|.*/holzBar/Permissions/.*'
    excluded_match_kinds:
      - comment
      - doccomment
    severity: error
  design_settings_bare_toggle:
    name: Bare Toggle in a Settings screen
    message: "Use `SettingsToggleRow` or `SettingsSwitch`: a bare `Toggle` draws a checkbox or a regular-size switch"
    regex: '\bToggle\('
    included:
      - '.*/holzBar/Settings/.*'
      - '.*/holzBar/MenuBar/Appearance/MenuBarAppearanceEditor/.*'
      - '.*/holzBar/MenuBar/NotchHub/[^/]+/[^/]*SettingsView\.swift'
    excluded: '.*/UI/Design/.*|.*/holzBar/Permissions/.*'
    excluded_match_kinds:
      - comment
      - doccomment
    severity: error
  design_settings_old_component:
    name: Old form component in a Settings screen
    message: "Use the settings kit (`SettingsPaneHost`, `SettingsGroup` and its rows) instead of the old form components"
    regex: '\b(?:HolzBarForm|HolzBarGroupBox|HolzBarSection)\b'
    included:
      - '.*/holzBar/Settings/.*'
      - '.*/holzBar/MenuBar/Appearance/MenuBarAppearanceEditor/.*'
      - '.*/holzBar/MenuBar/NotchHub/[^/]+/[^/]*SettingsView\.swift'
    excluded: '.*/UI/Design/.*|.*/holzBar/Permissions/.*'
    excluded_match_kinds:
      - comment
      - doccomment
    severity: error
  design_settings_annotation:
    name: Always-visible explanation in a Settings screen
    message: "Put the explanation in the row's info popover (`info:`) or in a state line"
    regex: '\.annotation\(|\bcaption\('
    included:
      - '.*/holzBar/Settings/.*'
      - '.*/holzBar/MenuBar/Appearance/MenuBarAppearanceEditor/.*'
      - '.*/holzBar/MenuBar/NotchHub/[^/]+/[^/]*SettingsView\.swift'
    excluded: '.*/UI/Design/.*|.*/holzBar/Permissions/.*'
    excluded_match_kinds:
      - comment
      - doccomment
    severity: error
  design_settings_group_literal:
    name: Group title literal in a Settings screen
    message: "Pass the group constant of the pane's catalog enum (`SettingsCatalog.<Pane>Pane`), never a string literal"
    regex: '\bSettingsGroup\(\s*\"'
    included:
      - '.*/holzBar/Settings/.*'
      - '.*/holzBar/MenuBar/Appearance/MenuBarAppearanceEditor/.*'
      - '.*/holzBar/MenuBar/NotchHub/[^/]+/[^/]*SettingsView\.swift'
    excluded: '.*/UI/Design/.*|.*/holzBar/Permissions/.*'
    excluded_match_kinds:
      - comment
      - doccomment
    severity: error

file_header:
  required_pattern: |-
    //
    //  SWIFTLINT_CURRENT_FILENAME
    //  holzBar
    //

modifier_order:
  preferred_modifier_order:
    - acl
    - setterACL
    - override
    - mutators
    - lazy
    - final
    - required
    - convenience
    - typeMethods
    - owned

trailing_comma:
  mandatory_comma: true
