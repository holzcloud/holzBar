name: Build
on:
  pull_request:
  push:
    branches: [ "main" ]
    paths:
      - "**/*.swift"
      - "holzBar.xcodeproj/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/select-xcode

      # Same settings as the release build (see release.yml), without publishing.
      - name: Build
        run: |
          set +e
          xcodebuild -project holzBar.xcodeproj -scheme holzBar -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build build \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            ENABLE_HARDENED_RUNTIME=NO > build.log 2>&1
          STATUS=$?
          # The Release build compiles arm64 and x86_64, so every warning
          # appears twice in build.log; list each one once, relative to the
          # repository. Warnings never fail the build.
          grep "warning:" build.log | sed "s|$GITHUB_WORKSPACE/||g" | sort -u > warnings.txt
          echo "==> $(wc -l < warnings.txt | tr -d ' ') compiler warnings"
          cat warnings.txt
          grep -E "error:|\*\* BUILD" build.log || tail -50 build.log
          exit $STATUS

      # The app connects to its embedded XPC service by MenuBarItemService.name; a mismatch
      # silently breaks item discovery on macOS 26, which no CI test would otherwise notice.
      - name: Check the identifiers
        run: |
          APP=build/Build/Products/Release/holzBar.app
          SERVICE="$APP/Contents/XPCServices/MenuBarItemService.xpc"
          APP_ID=$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")
          APP_NAME=$(plutil -extract CFBundleName raw -o - "$APP/Contents/Info.plist")
          DISPLAY_NAME=$(plutil -extract CFBundleDisplayName raw -o - "$APP/Contents/Info.plist")
          SERVICE_ID=$(plutil -extract CFBundleIdentifier raw -o - "$SERVICE/Contents/Info.plist")
          URL_SCHEMES=$(plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes json -o - "$APP/Contents/Info.plist")
          SERVICE_NAME=$(sed -nE 's/^[[:space:]]*static let name = "([^"]+)".*/\1/p' Shared/Services/MenuBarItemService.swift)
          echo "==> Identifiers"
          echo "app: $APP_ID"
          echo "name: $APP_NAME"
          echo "display name: $DISPLAY_NAME"
          echo "service: $SERVICE_ID"
          echo "URL schemes: $URL_SCHEMES"
          if [ "$SERVICE_ID" != "$SERVICE_NAME" ]; then
            echo "::error::The XPC service's bundle identifier ($SERVICE_ID) differs from MenuBarItemService.name ($SERVICE_NAME)"
            exit 1
          fi
          if [ "$SERVICE_ID" != "$APP_ID.MenuBarItemService" ]; then
            echo "::error::The XPC service's bundle identifier ($SERVICE_ID) is not the app's ($APP_ID) plus .MenuBarItemService"
            exit 1
          fi

  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/select-xcode

      - name: Run the unit tests
        run: swift test
