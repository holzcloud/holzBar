name: Build
on:
  pull_request:
    # Documentation-only changes need no build.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "Resources/Screenshots/**"
      - "Resources/Logo/**"
      - "LICENSE"
      - "NOTICE"

permissions:
  contents: read

jobs:
  build:
    # Xcode 27 (macOS 27 SDK) is only on the xcode-27 image (macOS 27).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/select-xcode

      # Same settings as the release build (see release.yml), without publishing: signed ad
      # hoc, with the hardened runtime the project turns on, and without get-task-allow, which
      # Xcode otherwise adds to code signed to run locally.
      - name: Build
        run: |
          # With its CI and Release skip (audit F-52, which ships together with this check),
          # the project's SwiftLint build phase runs no tool from the runner while CI is set;
          # nothing in this workflow may unset it.
          if [ "${CI:-}" != true ]; then
            echo "::error::CI is not set to true, so the project's SwiftLint build phase would run."
            exit 1
          fi
          set +e
          xcodebuild -project holzBar.xcodeproj -scheme holzBar -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build build \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO > build.log 2>&1
          STATUS=$?
          # The Release build compiles arm64 and x86_64, so every warning
          # appears twice in build.log; list each one once, relative to the
          # repository. Warnings never fail the build.
          grep "warning:" build.log | sed "s|$GITHUB_WORKSPACE/||g" | sort -u > warnings.txt
          echo "==> $(wc -l < warnings.txt | tr -d ' ') compiler warnings"
          cat warnings.txt
          # The packages and versions the build really used.
          echo "==> Resolved source packages"
          sed -n '/^Resolved source packages:/,/^$/p' build.log
          grep -E "error:|\*\* BUILD" build.log || tail -50 build.log
          if [ "$STATUS" -ne 0 ]; then
            # A failure without an error line (a compiler crash, a failed
            # tool) is explained by the failed commands and their output.
            echo "==> Failed build commands"
            sed -n '/^The following build commands failed:/,/^$/p' build.log
            grep -n -E "Assertion failed|Please submit a bug report|failed with a nonzero exit code|: fatal error" build.log | head -40
            grep -n -A30 "Stack dump" build.log | sed "s|$GITHUB_WORKSPACE/||g" | head -120
          fi
          APP=build/Build/Products/Release/holzBar.app
          if [ -d "$APP" ]; then
            echo "==> App size: $(du -sk "$APP" | cut -f1) KB"
          fi
          # Xcode compiled with the swift.org toolchain the select-xcode action
          # installed, not with its own Swift.
          SWIFTC_RUNS=$(grep -c -F "$HOLZBAR_SWIFT_TOOLCHAIN/usr/bin/swiftc" build.log || true)
          echo "==> $SWIFTC_RUNS compiler invocations from $HOLZBAR_SWIFT_TOOLCHAIN"
          if [ "$STATUS" -eq 0 ] && [ "$SWIFTC_RUNS" -eq 0 ]; then
            echo "::error::xcodebuild did not use the Swift toolchain at $HOLZBAR_SWIFT_TOOLCHAIN"
            exit 1
          fi
          exit $STATUS

      # Every build is hardened (library validation, no DYLD variables, no injected code) and
      # carries no entitlement, not even get-task-allow, which would let a debugger attach.
      # The script checks the app and every piece of code inside it.
      - name: Check the signature
        run: Scripts/check-signature.sh build/Build/Products/Release/holzBar.app

      # The app's identity (CLAUDE.md, "Naming"): a changed bundle identifier would lose every
      # user's settings and permissions, and the URL scheme is how Shortcuts, Raycast and
      # scripts reach holzBar. Each value is printed and must be exactly what users rely on.
      - name: Check the identifiers
        run: |
          PLIST=build/Build/Products/Release/holzBar.app/Contents/Info.plist
          APP_ID=$(plutil -extract CFBundleIdentifier raw -o - "$PLIST")
          APP_NAME=$(plutil -extract CFBundleName raw -o - "$PLIST")
          DISPLAY_NAME=$(plutil -extract CFBundleDisplayName raw -o - "$PLIST")
          URL_TYPES=$(plutil -extract CFBundleURLTypes json -o - "$PLIST" 2> /dev/null || true)
          echo "==> Identifiers"
          echo "app: $APP_ID"
          echo "name: $APP_NAME"
          echo "display name: $DISPLAY_NAME"
          echo "URL types: ${URL_TYPES:-none}"
          FAILED=0
          if [ "$APP_ID" != com.holzcloud.holzBar ]; then
            echo "::error::The bundle identifier is $APP_ID, not com.holzcloud.holzBar"
            FAILED=1
          fi
          if [ "$APP_NAME" != holzBar ]; then
            echo "::error::CFBundleName is $APP_NAME, not holzBar"
            FAILED=1
          fi
          if [ "$DISPLAY_NAME" != holzBar ]; then
            echo "::error::CFBundleDisplayName is $DISPLAY_NAME, not holzBar"
            FAILED=1
          fi
          if ! grep -q '"holzbar"' <<< "$URL_TYPES"; then
            echo "::error::The app does not declare the URL scheme holzbar"
            FAILED=1
          fi
          exit "$FAILED"

      # holzBar never connects to the network (CLAUDE.md, "Private"). The no-network job checks
      # the sources; this step checks what was really built: no executable in the app may
      # reference URLSession, NSURLConnection, WKWebView, Network connections, listeners or
      # browsers, or BSD sockets, or link WebKit. "Check the signature" already rejects every
      # entitlement, network ones included. NWPathMonitor (the "Reveal when offline" rule)
      # only observes whether a network path exists, so its symbols pass.
      - name: Check the binaries for network code
        run: |
          APP=build/Build/Products/Release/holzBar.app
          # A regular expression: the $ signs are meant literally, not as shell expansions.
          # shellcheck disable=SC2016
          PATTERN='_OBJC_CLASS_\$_(NSURLSession|NSURLConnection|WKWebView)|Foundation\.URLSession|Network\.NW(Connection|Listener|Browser)|_nw_(connection|listener|browser)_|(^|[^A-Za-z0-9_])_(socket|connect|getaddrinfo)( |$)'
          FAILED=0
          COUNT=0
          while IFS= read -r -d '' BIN; do
            NAME="${BIN#"$APP"/}"
            COUNT=$((COUNT + 1))
            HITS=$(nm -um "$BIN" | xcrun swift-demangle | grep -E "$PATTERN" || true)
            if [ -n "$HITS" ]; then
              echo "$HITS"
              echo "::error::$NAME references network APIs (lines above)"
              FAILED=1
            fi
            if otool -L "$BIN" | grep -q 'WebKit.framework'; then
              echo "::error::$NAME links WebKit"
              FAILED=1
            fi
          done < <(find "$APP" -type f \( -path '*/Contents/MacOS/*' -o -name '*.dylib' \) -print0)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No executable found in $APP"
            FAILED=1
          fi
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "==> No network code in the $COUNT executables of the app"

      # Every license text shown under Settings, About, Acknowledgements must be in the app.
      # holzBar links no package since 05.1, so there may be no license file at all.
      - name: Check the acknowledgements
        run: |
          shopt -s nullglob
          RESOURCES=build/Build/Products/Release/holzBar.app/Contents/Resources
          COUNT=0
          MISSING=0
          for FILE in holzBar/Resources/Acknowledgements/*.txt; do
            NAME=$(basename "$FILE")
            if [ -n "$(find "$RESOURCES" -name "$NAME" -print -quit)" ]; then
              COUNT=$((COUNT + 1))
            else
              echo "::error::$NAME is missing from the built holzBar.app"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi
          echo "==> Acknowledgements: $COUNT license files in the app"

      # The String Catalogs must reach the app in every language, and the App Intents
      # metadata must be extracted, or Shortcuts shows none of holzBar's actions.
      - name: Check the languages and the Shortcuts actions
        run: |
          RESOURCES=build/Build/Products/Release/holzBar.app/Contents/Resources
          FAILED=0
          # The listings only show the folders' contents in the log.
          # shellcheck disable=SC2012
          echo "Resources: $(ls "$RESOURCES" | tr '\n' ' ')"
          for LANGUAGE in en de fr it rm; do
            # shellcheck disable=SC2012
            FILES=$(ls "$RESOURCES/$LANGUAGE.lproj" 2>/dev/null | tr '\n' ' ' || true)
            echo "$LANGUAGE.lproj: ${FILES:-missing}"
            if [ "$LANGUAGE" != en ] && [ ! -f "$RESOURCES/$LANGUAGE.lproj/Localizable.strings" ]; then
              echo "::error::$LANGUAGE.lproj/Localizable.strings is missing from the built holzBar.app"
              FAILED=1
            fi
          done
          if [ ! -d "$RESOURCES/Metadata.appintents" ]; then
            echo "::error::Metadata.appintents is missing from the built holzBar.app"
            FAILED=1
          fi
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "==> Five languages and the App Intents metadata in the app"

      - name: Keep the app for the compatibility check
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: holzBar-app
          path: build/Build/Products/Release/holzBar.app
          retention-days: 1

  # holzBar's deployment target is macOS 14, but only macOS 26 and 27 are tested. Both
  # launch the app built above (a missing symbol or a crash at launch fails here). macOS 26
  # also runs the unit tests with that runner's newest Xcode and the pinned Swift
  # toolchain; on macOS 27 (the xcode-27 image) the test job runs them already.
  compat:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: holzBar-app
          path: holzBar.app

      - name: Launch the app
        run: |
          sw_vers
          APP="$PWD/holzBar.app"
          # upload-artifact keeps no file modes: make every executable in the app executable again.
          find "$APP" -type f -path '*/Contents/MacOS/*' -exec chmod +x {} +
          echo "==> Minimum macOS: $(vtool -show-build "$APP/Contents/MacOS/holzBar" | awk '/minos/ {print $2; exit}')"
          "$APP/Contents/MacOS/holzBar" > launch.log 2>&1 &
          PID=$!
          sleep 20
          if kill -0 "$PID" 2>/dev/null; then
            echo "==> holzBar is still running after 20 s on macOS $(sw_vers -productVersion)"
            kill "$PID"
          else
            STATUS=0
            wait "$PID" || STATUS=$?
            echo "::error::holzBar exited at launch on macOS $(sw_vers -productVersion) (status $STATUS)"
            echo "==> Output"
            cat launch.log
            echo "==> Crash report"
            sleep 5
            # Newest first; report names contain no newlines.
            # shellcheck disable=SC2010
            REPORT=$(ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i holzbar | head -1 || true)
            if [ -n "$REPORT" ]; then
              head -c 20000 ~/Library/Logs/DiagnosticReports/"$REPORT"
            fi
            echo "==> Log"
            log show --last 2m --style compact --predicate 'process == "holzBar"' 2>/dev/null | tail -60 || true
            exit 1
          fi

      - name: Find the newest Xcode
        if: matrix.runner != 'xcode-27'
        id: xcode
        run: |
          # Xcode bundle names contain no newlines.
          # shellcheck disable=SC2012
          VERSION=$(ls -d /Applications/Xcode_*.app | sed -E 's|.*/Xcode_(.*)\.app|\1|' | grep -E '^[0-9]+(\.[0-9]+)*$' | sort -V | tail -1)
          echo "==> Xcode $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/select-xcode
        if: matrix.runner != 'xcode-27'
        with:
          version: ${{ steps.xcode.outputs.version }}

      - name: Run the unit tests
        if: matrix.runner != 'xcode-27'
        run: |
          swift --version
          swift test

  # The app's former name must not appear anywhere in the repository (see CLAUDE.md).
  # .planning/ and .claude/ are GSD's working state; .github/cms-version.py is a copy
  # of a tool maintained in holzcloud-design. The pattern is written so that it does
  # not match itself.
  former-name:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for the former name
        run: |
          PATTERN='holz[ -]?[i]ce'
          EXCLUDE=(':(exclude).planning' ':(exclude).claude' ':(exclude).github/cms-version.py')
          set +e
          git grep -n -i -E "$PATTERN" -- . "${EXCLUDE[@]}"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "::error::The former name appears in the lines above."
            exit 1
          elif [ "$STATUS" -ne 1 ]; then
            echo "::error::git grep failed with status $STATUS."
            exit "$STATUS"
          fi
          NAMES=$(git ls-files -- . "${EXCLUDE[@]}" | grep -i -E "$PATTERN" || true)
          if [ -n "$NAMES" ]; then
            echo "$NAMES"
            echo "::error::The former name appears in the file names above."
            exit 1
          fi
          echo "==> The former name appears nowhere."

  # holzBar never connects to the network and keeps personal data out of public logs
  # (CLAUDE.md, "Private"). Fails every pull request that adds networking code or a
  # Swift package, or a log interpolation that does not name its privacy or makes
  # personal data public. Runs locally too: python3 .github/scripts/privacy-check.py network|logs
  no-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No network code
        run: python3 .github/scripts/privacy-check.py network

      - name: Logs keep personal data private
        run: python3 .github/scripts/privacy-check.py logs

  # holzBar speaks English, German, French, Italian and Romansh. Fails every pull
  # request that adds a text without its translations, or a translation that is
  # unfinished or changes the format specifiers of its text.
  # Runs locally too: python3 .github/scripts/strings-check.py
  strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every text in five languages
        run: python3 .github/scripts/strings-check.py

  # The release workflow runs only for a v* tag, so a broken expression or script in it would
  # surface only then. actionlint (with shellcheck) checks every workflow on every pull
  # request; workflow-check.py enforces pinned actions, read-only tokens and where secrets
  # and write permissions may be used. Runs locally too: python3 .github/scripts/workflow-check.py
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The official image, with shellcheck, pinned by digest like the SwiftLint image in
      # lint.yml. Bumping actionlint means updating both the tag and the digest; Dependabot
      # does not update docker:// references.
      - name: Lint the workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      - name: Pinned actions, read-only tokens, secrets only where they are needed
        run: python3 .github/scripts/workflow-check.py

  test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/select-xcode

      # swift honors TOOLCHAINS (set by select-xcode): the tests run with the swift.org toolchain.
      - name: Run the unit tests
        run: |
          swift --version
          swift test
