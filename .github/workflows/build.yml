name: Build
on:
  pull_request:
  push:
    branches: [ "main" ]
    paths:
      - "**/*.swift"
      - "holzBar.xcodeproj/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/select-xcode

      # Same settings as the release build (see release.yml), without publishing.
      - name: Build
        run: |
          set +e
          xcodebuild -project holzBar.xcodeproj -scheme holzBar -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build build \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            ENABLE_HARDENED_RUNTIME=NO > build.log 2>&1
          STATUS=$?
          # The Release build compiles arm64 and x86_64, so every warning
          # appears twice in build.log; list each one once, relative to the
          # repository. Warnings never fail the build.
          grep "warning:" build.log | sed "s|$GITHUB_WORKSPACE/||g" | sort -u > warnings.txt
          echo "==> $(wc -l < warnings.txt | tr -d ' ') compiler warnings"
          cat warnings.txt
          # The packages and versions the build really used.
          echo "==> Resolved source packages"
          sed -n '/^Resolved source packages:/,/^$/p' build.log
          grep -E "error:|\*\* BUILD" build.log || tail -50 build.log
          APP=build/Build/Products/Release/holzBar.app
          if [ -d "$APP" ]; then
            echo "==> App size: $(du -sk "$APP" | cut -f1) KB"
          fi
          exit $STATUS

      # The app connects to its embedded XPC service by MenuBarItemService.name; a mismatch
      # silently breaks item discovery on macOS 26, which no CI test would otherwise notice.
      - name: Check the identifiers
        run: |
          APP=build/Build/Products/Release/holzBar.app
          SERVICE="$APP/Contents/XPCServices/MenuBarItemService.xpc"
          APP_ID=$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")
          APP_NAME=$(plutil -extract CFBundleName raw -o - "$APP/Contents/Info.plist")
          DISPLAY_NAME=$(plutil -extract CFBundleDisplayName raw -o - "$APP/Contents/Info.plist")
          SERVICE_ID=$(plutil -extract CFBundleIdentifier raw -o - "$SERVICE/Contents/Info.plist")
          URL_SCHEMES=$(plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes json -o - "$APP/Contents/Info.plist")
          SERVICE_NAME=$(sed -nE 's/^[[:space:]]*static let name = "([^"]+)".*/\1/p' Shared/Services/MenuBarItemService.swift)
          echo "==> Identifiers"
          echo "app: $APP_ID"
          echo "name: $APP_NAME"
          echo "display name: $DISPLAY_NAME"
          echo "service: $SERVICE_ID"
          echo "URL schemes: $URL_SCHEMES"
          if [ "$SERVICE_ID" != "$SERVICE_NAME" ]; then
            echo "::error::The XPC service's bundle identifier ($SERVICE_ID) differs from MenuBarItemService.name ($SERVICE_NAME)"
            exit 1
          fi
          if [ "$SERVICE_ID" != "$APP_ID.MenuBarItemService" ]; then
            echo "::error::The XPC service's bundle identifier ($SERVICE_ID) is not the app's ($APP_ID) plus .MenuBarItemService"
            exit 1
          fi

      # holzBar never connects to the network (CLAUDE.md, "Private"). The no-network job checks
      # the sources; this step checks what was really built: neither executable may reference
      # URLSession, NSURLConnection, WKWebView, Network connections, listeners or browsers, or
      # BSD sockets, link WebKit, or carry a network entitlement. NWPathMonitor (the "Reveal
      # when offline" rule) only observes whether a network path exists, so its symbols pass.
      - name: Check the binaries for network code
        run: |
          APP=build/Build/Products/Release/holzBar.app
          SERVICE="$APP/Contents/XPCServices/MenuBarItemService.xpc"
          PATTERN='_OBJC_CLASS_\$_(NSURLSession|NSURLConnection|WKWebView)|Foundation\.URLSession|Network\.NW(Connection|Listener|Browser)|_nw_(connection|listener|browser)_|(^|[^A-Za-z0-9_])_(socket|connect|getaddrinfo)( |$)'
          FAILED=0
          for BIN in "$APP/Contents/MacOS/holzBar" "$SERVICE/Contents/MacOS/MenuBarItemService"; do
            NAME=$(basename "$BIN")
            HITS=$(nm -um "$BIN" | xcrun swift-demangle | grep -E "$PATTERN" || true)
            if [ -n "$HITS" ]; then
              echo "$HITS"
              echo "::error::$NAME references network APIs (lines above)"
              FAILED=1
            fi
            if otool -L "$BIN" | grep -q 'WebKit.framework'; then
              echo "::error::$NAME links WebKit"
              FAILED=1
            fi
          done
          for BUNDLE in "$APP" "$SERVICE"; do
            if codesign -d --entitlements - --xml "$BUNDLE" 2>/dev/null | grep -q 'com.apple.security.network'; then
              echo "::error::$(basename "$BUNDLE") carries a network entitlement"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "==> No network code in the binaries"

      # Every license text shown under Settings, About, Acknowledgements must be in the app.
      # holzBar links no package since 05.1, so there may be no license file at all.
      - name: Check the acknowledgements
        run: |
          shopt -s nullglob
          RESOURCES=build/Build/Products/Release/holzBar.app/Contents/Resources
          COUNT=0
          MISSING=0
          for FILE in holzBar/Resources/Acknowledgements/*.txt; do
            NAME=$(basename "$FILE")
            if [ -n "$(find "$RESOURCES" -name "$NAME" -print -quit)" ]; then
              COUNT=$((COUNT + 1))
            else
              echo "::error::$NAME is missing from the built holzBar.app"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi
          echo "==> Acknowledgements: $COUNT license files in the app"

  # The app's former name must not appear anywhere in the repository (see CLAUDE.md).
  # .planning/ and .claude/ are GSD's working state; .github/cms-version.py is a copy
  # of a tool maintained in holzcloud-design. The pattern is written so that it does
  # not match itself.
  former-name:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for the former name
        run: |
          PATTERN='holz[ -]?[i]ce'
          EXCLUDE=(':(exclude).planning' ':(exclude).claude' ':(exclude).github/cms-version.py')
          set +e
          git grep -n -i -E "$PATTERN" -- . "${EXCLUDE[@]}"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "::error::The former name appears in the lines above."
            exit 1
          elif [ "$STATUS" -ne 1 ]; then
            echo "::error::git grep failed with status $STATUS."
            exit "$STATUS"
          fi
          NAMES=$(git ls-files -- . "${EXCLUDE[@]}" | grep -i -E "$PATTERN" || true)
          if [ -n "$NAMES" ]; then
            echo "$NAMES"
            echo "::error::The former name appears in the file names above."
            exit 1
          fi
          echo "==> The former name appears nowhere."

  # holzBar never connects to the network and keeps personal data out of public logs
  # (CLAUDE.md, "Private"). Fails every pull request that adds networking code or a
  # Swift package, or a log interpolation that does not name its privacy or makes
  # personal data public. Runs locally too: python3 .github/scripts/privacy-check.py network|logs
  no-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No network code
        run: python3 .github/scripts/privacy-check.py network

      - name: Logs keep personal data private
        run: python3 .github/scripts/privacy-check.py logs

  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/select-xcode

      - name: Run the unit tests
        run: swift test
