# OpenSSF Scorecard rates the repository's supply-chain practices (pinned dependencies,
# token permissions, branch protection, signed releases, ...). The results go to
# scorecard.dev, which serves the README badge, and to code scanning. publish_results makes
# the Scorecard API accept results only from a workflow without top-level env or defaults
# and a job that runs nothing but the approved actions: no run steps, no env, no defaults.
name: Scorecard
on:
  push:
    branches: [ main ]
  schedule:
    - cron: "41 5 * * 1"
  # Re-scores when a branch protection rule or ruleset changes.
  branch_protection_rule:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Uploads the results to code scanning.
      security-events: write
      # Proves to the Scorecard API that the results come from this workflow.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No repo_token: no extra secret; Branch-Protection then scores what the default
      # token can read.
      - name: Run the analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload the results to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
