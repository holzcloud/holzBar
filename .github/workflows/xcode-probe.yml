name: Xcode probe
on:
  push:
    branches: [claude/ice-fork-development-hzdl1d]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-27, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - run: |
          sw_vers
          ls -d /Applications/Xcode* || true
          for x in /Applications/Xcode_27*.app; do [ -d "$x" ] && "$x/Contents/Developer/usr/bin/xcodebuild" -version && DEVELOPER_DIR="$x/Contents/Developer" xcrun swift --version; done || true
