name: Lint Swift Files
on:
  pull_request:
    paths:
      - ".github/workflows/lint.yml"
      - ".swiftlint.yml"
      - "**/*.swift"
permissions:
  contents: read
jobs:
  swiftlint:
    runs-on: ubuntu-latest
    env:
      # The official SwiftLint image, pinned by digest so a re-pushed tag
      # cannot change what runs. Bumping SwiftLint means updating both the
      # version tag and the digest.
      SWIFTLINT_IMAGE: ghcr.io/realm/swiftlint:0.65.1@sha256:f47e083201e47a136cda5ae847595bfe00226c444ca226fa74fa5dc648a9b057
    steps:
      - uses: actions/checkout@v7
      - name: Run SwiftLint
        # The image's entrypoint is /usr/bin/swiftlint, so the container takes
        # SwiftLint's arguments directly. The checkout is mounted at the same
        # path so the reported paths match it.
        run: |
          swiftlint() {
            docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" "$SWIFTLINT_IMAGE" "$@"
          }
          swiftlint version
          swiftlint lint --strict
