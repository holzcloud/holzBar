# Checks the cask with `brew style` and `brew audit`, loaded from this repository as
# the tap. Nothing is downloaded or installed. It runs only when the cask changes.
name: Cask
on:
  pull_request:
    paths:
      - "Casks/**"
      - ".github/workflows/cask.yml"

permissions:
  contents: read

jobs:
  cask:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Style and audit the cask
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          set -euo pipefail

          # Users run a current Homebrew; the runner image may be older.
          brew update --quiet
          brew --version

          # A local copy of this pull request's commit on a main branch serves as the tap.
          SRC="$RUNNER_TEMP/tap-src"
          git clone --quiet "$GITHUB_WORKSPACE" "$SRC"
          git -C "$SRC" checkout --quiet -B main "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"

          brew tap holzcloud/holzbar "$SRC"
          brew trust --cask holzcloud/holzbar/holzbar
          brew style --cask holzcloud/holzbar/holzbar
          brew audit --cask --strict holzcloud/holzbar/holzbar
