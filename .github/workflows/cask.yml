# Proves the path a holzIce user takes to holzBar: holzice 0.0.5 installed from the
# tap as it was before the rename, then `brew update && brew upgrade`. Homebrew must
# rename the installed cask to holzbar (cask_renames.json), upgrade it without a
# conflict and uninstall it, and the cask must pass `brew style` and `brew audit`.
# It installs a real app on a macOS runner, so it runs only when the cask changes.
name: Cask
on:
  pull_request:
    paths:
      - "Casks/**"
      - "cask_renames.json"
      - ".github/workflows/cask.yml"

permissions:
  contents: read

jobs:
  cask:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Migrate holzice to holzbar
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
          # main before the rename: Casks/holzice.rb at 0.0.5
          OLD_COMMIT: 2b1b4f862993c38eb5452a22d0149a405816d844
        run: |
          set -euo pipefail

          # Users run a current Homebrew; the runner image may be older.
          brew update --quiet
          brew --version

          # A local copy of this repository serves as the tap, so its main can be
          # moved from the pre-rename commit to this pull request's commit.
          PR_COMMIT=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)
          SRC="$RUNNER_TEMP/tap-src"
          git clone --quiet "$GITHUB_WORKSPACE" "$SRC"

          # A holzIce user as of before the rename: tapped, trusted holzice, installed it.
          install_holzice() {
            git -C "$SRC" checkout --quiet -B main "$OLD_COMMIT"
            brew tap holzcloud/holzice "$SRC"
            brew trust --cask holzcloud/holzice/holzice
            brew install --cask holzcloud/holzice/holzice
            test -d /Applications/holzIce.app
            echo "==> installed holzice from the pre-rename tap"
            # The rename lands on main; the next `brew update` fetches it.
            git -C "$SRC" checkout --quiet -B main "$PR_COMMIT"
          }

          migrated() {
            grep -qx holzbar <<< "$(brew list --cask)"
          }

          upgrade_and_uninstall() {
            brew upgrade --cask holzbar
            brew uninstall --cask holzbar
            test ! -e /Applications/holzIce.app
            test ! -e /Applications/holzBar.app
          }

          # 1. Does the trust given to holzice carry over to holzbar? Homebrew loads a
          #    tap's casks only when they are trusted, and the migration loads holzbar.
          install_holzice
          brew update
          if migrated; then
            echo "==> trust carried over: yes"
          else
            echo "==> trust carried over: no"
            # A user who ran `brew update` before trusting holzbar: trust it, then
            # `brew migrate` does what the update would have done.
            brew trust --cask holzcloud/holzice/holzbar
            brew migrate --cask holzice
            if migrated; then
              echo "==> migrated after brew migrate: yes"
            else
              echo "==> migrated after brew migrate: no"
              brew list --cask
              exit 1
            fi
          fi
          upgrade_and_uninstall
          brew untap holzcloud/holzice
          # The migration leaves Caskroom/holzice as a link to Caskroom/holzbar.
          CASKROOM=$(brew --caskroom)
          if [ -L "$CASKROOM/holzice" ]; then
            echo "Removing the leftover link $CASKROOM/holzice"
            rm "$CASKROOM/holzice"
          fi

          # 2. The README's path: trust holzbar, then `brew update && brew upgrade`.
          install_holzice
          brew trust --cask holzcloud/holzice/holzbar
          brew update 2>&1 | tee "$RUNNER_TEMP/update.log"
          if migrated; then
            echo "==> migrated: yes"
          else
            echo "==> migrated: no"
            echo "brew list --cask:"
            brew list --cask
            echo "brew update output:"
            cat "$RUNNER_TEMP/update.log"
            exit 1
          fi

          brew style --cask holzcloud/holzice/holzbar
          brew audit --cask --strict holzcloud/holzice/holzbar

          upgrade_and_uninstall
          echo "==> uninstalled: yes"
