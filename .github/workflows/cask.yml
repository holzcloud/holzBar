# Checks both casks (holzbar and holzbar@beta) with `brew style` and `brew audit`, loaded
# from this repository as the tap. Nothing is downloaded or installed. It runs only when
# a cask changes.
name: Cask
on:
  pull_request:
    paths:
      - "Casks/**"
      - ".github/workflows/cask.yml"

permissions:
  contents: read

jobs:
  cask:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Style and audit the casks
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          set -euo pipefail

          # Users run a current Homebrew; the runner image may be older.
          brew update --quiet
          brew --version

          # A local copy of this pull request's commit on a main branch serves as the tap.
          SRC="$RUNNER_TEMP/tap-src"
          git clone --quiet "$GITHUB_WORKSPACE" "$SRC"
          git -C "$SRC" checkout --quiet -B main "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"

          brew tap holzcloud/holzbar "$SRC"
          for TOKEN in holzbar holzbar@beta; do
            brew trust --cask "holzcloud/holzbar/$TOKEN"
            brew style --cask "holzcloud/holzbar/$TOKEN"
            brew audit --cask --strict "holzcloud/holzbar/$TOKEN"
          done
