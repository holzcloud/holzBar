name: Release
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, e.g. 0.0.6-beta1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    # The version, for the holzcloud-ch job below.
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The version comes from the dispatch input or the tag name. Both are
      # untrusted, so they reach the shell only through the environment and
      # are validated before anything else uses them.
      - name: Determine version
        id: version
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${DISPATCH_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta[0-9]+)?$ ]]; then
            # Do not echo the rejected value: it could carry workflow commands.
            echo "::error::The version must look like 0.0.6 or 0.0.6-beta1."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check the release notes
        run: |
          test -f "docs/release-notes/v$VERSION.md" || { echo "::error::Missing docs/release-notes/v$VERSION.md"; exit 1; }

      - uses: ./.github/actions/select-xcode

      # Signed ad hoc: there is no Developer ID. The hardened runtime would then
      # refuse any embedded framework with a team of its own (see Scripts/install.sh).
      - name: Build
        run: |
          xcodebuild -project holzBar.xcodeproj -scheme holzBar -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            ENABLE_HARDENED_RUNTIME=NO
          codesign --verify --deep --strict build/Build/Products/Release/holzBar.app

      - name: Package
        run: |
          ZIP="holzBar-$VERSION.zip"
          ditto -c -k --keepParent build/Build/Products/Release/holzBar.app "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "SHA256=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          # holzBar is in beta until 1.0: every 0.x release, and every tag with a
          # suffix such as -beta1, is published as a pre-release.
          PRERELEASE=()
          if [[ "$TAG" == v0.* || "$TAG" == *-* ]]; then
            PRERELEASE=(--prerelease)
          fi
          NOTES="docs/release-notes/$TAG.md"
          gh release create "$TAG" "$ZIP" \
            --target "$GITHUB_SHA" --title "holzBar $TAG" --notes-file "$NOTES" "${PRERELEASE[@]}"

      # Until the first holzBar release the cask installs 0.0.5, the app under its former name. Every
      # release points it at the holzBar zip and app just published; once that
      # is done, these edits change nothing but the version and sha256.
      - name: Update the Homebrew cask
        run: |
          git fetch origin main
          git checkout -B main origin/main
          sed -i '' -E \
            -e "s/^  version \".*\"/  version \"$VERSION\"/" \
            -e "s/^  sha256 .*/  sha256 \"$SHA256\"/" \
            -e '/^  # Until the first holzBar release/d' \
            -e 's|^  url ".*"$|  url "https://github.com/holzcloud/holzBar/releases/download/v#{version}/holzBar-#{version}.zip"|' \
            -e 's|^  app ".*"$|  app "holzBar.app"|' \
            -e 's|"[{][{]appdir[}][}]/[^"/]*[.]app"|"{{appdir}}/holzBar.app"|' \
            -e 's|writable_paths: [[]"[^"/]*[.]app"[]]|writable_paths: ["holzBar.app"]|' \
            -e 's|^  uninstall quit: .*|  uninstall quit: "com.holzcloud.holzBar"|' \
            Casks/holzbar.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "holzbar $VERSION"
          git push origin main

  # holzcloud.ch shows the released version on the holzBar (formerly
  # holzIce) page in five languages. This writes it there through the holzcloud-CMS once the
  # release exists, and reads it back. A beta (0.0.6-beta1) is skipped: the
  # site keeps showing the last plain release. .github/cms-version.py is a
  # copy of holzcloud-design's tools/cms-version.py, where its tests live
  # (that repository is private, so its reusable workflow cannot be called
  # from here). Without the CMS_TOKEN secret it prints a notice and succeeds.
  holzcloud-ch:
    name: Show the version on holzcloud.ch
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/cms-version.py
          sparse-checkout-cone-mode: false
      - name: Write the version into the project pages and read it back
        env:
          CMS_TOKEN: ${{ secrets.CMS_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: python3 .github/cms-version.py --project holzbar --version "$VERSION"
