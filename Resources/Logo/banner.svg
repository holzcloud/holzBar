<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3200 800" width="3200" height="800">
 <!--
  The holzBar README banner (holzcloud project banner layout): the logo, the name,
  the tagline and tags at the left, a menu bar with the holzBar menu open at the right.
  Resources/Logo/banner.png is rendered from this file at 3200x800 with Chromium by
  Resources/Logo/render-banner.js, which turns the screen group (#screen-tilt) towards the text;
  the PNG uses Plus Jakarta Sans (SIL Open Font License 1.1), which is not committed.
 -->
 <defs>
  <radialGradient id="glow" cx="300" cy="80" r="1500" gradientUnits="userSpaceOnUse">
   <stop offset="0" stop-color="#1A3650"/>
   <stop offset="0.55" stop-color="#0A1426"/>
  </radialGradient>
  <radialGradient id="screen-glow" cx="2500" cy="420" r="900" gradientUnits="userSpaceOnUse">
   <stop offset="0" stop-color="#12304D" stop-opacity="0.8"/>
   <stop offset="1" stop-color="#0A1426" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="desktop" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#2B76AE"/>
   <stop offset="1" stop-color="#1D5D93"/>
  </linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.55"/></filter>
  <filter id="menu-shadow" x="-15%" y="-15%" width="130%" height="135%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#06223A" flood-opacity="0.6"/></filter>
  <filter id="tile-shadow" x="-15%" y="-15%" width="130%" height="135%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/></filter>
  <clipPath id="screen"><rect x="1954" y="64" width="1064" height="682" rx="30"/></clipPath>
  <mask id="cut">
   <rect width="40" height="40" fill="#FFFFFF"/>
   <path d="M23.5 11 L16.5 16 L23.5 21" fill="none" stroke="#000000" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </mask>
  <style>
   text { font-family: 'Plus Jakarta Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
   .title { font-size: 156px; font-weight: 600; letter-spacing: -2px; }
   .tagline { font-size: 46px; font-weight: 400; }
   .tag { font-size: 32px; font-weight: 500; }
   .item { font-size: 33px; font-weight: 500; fill: #FFFFFF; }
   .key { font-size: 30px; font-weight: 500; fill: #FFFFFF; opacity: 0.55; }
   .clock { font-size: 30px; font-weight: 600; fill: #FFFFFF; }
  </style>
 </defs>

 <!-- background -->
 <rect width="3200" height="800" fill="#0A1426"/>
 <rect width="3200" height="800" fill="url(#glow)"/>
 <rect width="3200" height="800" fill="url(#screen-glow)"/>

 <!-- logo tile (Resources/Logo/holzBar.svg, scaled to 200 px) -->
 <g filter="url(#tile-shadow)" transform="translate(135.73 85.73) scale(0.24272)">
   <defs>
   <clipPath id="logo-plank"><rect x="207" y="702" width="610" height="107" rx="37"/></clipPath>
   </defs>
   <rect x="100" y="100" width="824" height="824" rx="185" fill="#0A1426"/>
   <rect x="207" y="702" width="610" height="107" rx="37" fill="#C98B4F"/>
   <rect x="207" y="702" width="610" height="25" rx="12" fill="#E0A869" opacity="0.7" clip-path="url(#logo-plank)"/>
   <g fill="none" stroke="#9B6534" stroke-linecap="round">
   <path d="M265 759 C388 743 545 780 759 755" stroke-width="10.7"/>
   <path d="M339 784 C446 772 586 792 677 780" stroke-width="8" opacity="0.7"/>
   <ellipse cx="594" cy="751" rx="25" ry="12" stroke-width="8"/>
   </g>
   <rect x="247" y="520" width="530" height="150" rx="52" fill="#D6F3FF"/>
   <path d="M370 552 L320 595 L370 638" fill="none" stroke="#1C78AE" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
   <circle cx="480" cy="595" r="22" fill="#1C78AE" opacity="0.35"/>
   <circle cx="560" cy="595" r="22" fill="#1C78AE" opacity="0.35"/>
   <circle cx="640" cy="595" r="22" fill="#1C78AE"/>
   <circle cx="715" cy="595" r="22" fill="#1C78AE"/>
   <path d="M760 400 l12 33 33 12 -33 12 -12 33 -12 -33 -33 -12 33 -12z" fill="#FFFFFF"/>
 </g>

 <!-- name and tagline -->
 <text x="404" y="262" class="title" fill="#F6EFE6">holzBar</text>
 <text x="160" y="410" class="tagline" fill="#C9D2DE">The menu bar manager for macOS —</text>
 <text x="160" y="468" class="tagline" fill="#C9D2DE">ready for macOS 27.</text>

 <!-- tags -->
  <rect x="160" y="520" width="141" height="72" rx="36" fill="#5EC8F2"/>
  <text x="230.5" y="567" text-anchor="middle" class="tag" fill="#0A1426">Beta</text>
  <rect x="324.5" y="521.5" width="199" height="69" rx="34.5" fill="#12283D" stroke="#336F8D" stroke-width="3"/>
  <text x="424" y="567" text-anchor="middle" class="tag" fill="#5EC0F2">GPL-3.0</text>
  <rect x="548.5" y="521.5" width="237" height="69" rx="34.5" fill="#12283D" stroke="#336F8D" stroke-width="3"/>
  <text x="667" y="567" text-anchor="middle" class="tag" fill="#5EC0F2">Homebrew</text>
 <!-- principles -->
  <rect x="161.5" y="613.5" width="368" height="69" rx="34.5" fill="#0E1E31" stroke="#2A4157" stroke-width="3"/>
  <text x="345.5" y="659" text-anchor="middle" class="tag" fill="#C9D2DE">Private · no network</text>
  <rect x="554.5" y="613.5" width="234" height="69" rx="34.5" fill="#0E1E31" stroke="#2A4157" stroke-width="3"/>
  <text x="671.5" y="659" text-anchor="middle" class="tag" fill="#C9D2DE">Lean &amp; fast</text>
  <rect x="813.5" y="613.5" width="289" height="69" rx="34.5" fill="#0E1E31" stroke="#2A4157" stroke-width="3"/>
  <text x="958" y="659" text-anchor="middle" class="tag" fill="#C9D2DE">Least privilege</text>
  <rect x="1127.5" y="613.5" width="286" height="69" rx="34.5" fill="#0E1E31" stroke="#2A4157" stroke-width="3"/>
  <text x="1270.5" y="659" text-anchor="middle" class="tag" fill="#C9D2DE">Native macOS</text>

 <!-- screen; render-banner.js turns it towards the text in 3D -->
 <g id="screen-tilt">
  <g filter="url(#shadow)">
   <rect x="1940" y="50" width="1092" height="710" rx="42" fill="#09121D"/>
  </g>
  <rect x="1941.5" y="51.5" width="1089" height="707" rx="40.5" fill="none" stroke="#2A3E55" stroke-width="3"/>
  <g clip-path="url(#screen)">
   <rect x="1954" y="64" width="1064" height="682" fill="url(#desktop)"/>
   <!-- menu bar -->
   <rect x="1954" y="64" width="1064" height="66" fill="#2E80B8"/>
   <g fill="#FFFFFF" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- holzBar control item (Resources/Logo/menu-bar-fill.svg) -->
    <g transform="translate(2036 77) scale(1.05)" stroke="none">
     <rect x="9" y="5" width="22" height="22" rx="5.5" mask="url(#cut)"/>
     <rect x="3" y="30" width="34" height="4.2" rx="2.1"/>
    </g>
    <!-- system-like status items -->
    <rect x="2112" y="88" width="30" height="20" rx="4" stroke="none"/>
    <circle cx="2190" cy="98" r="8" fill="none" stroke-width="3.5"/>
    <circle cx="2246" cy="98" r="11" fill="none" stroke-width="3.5"/>
    <path d="M2246 91 v7 l5 4" fill="none" stroke-width="3"/>
    <g stroke="none"><circle cx="2295" cy="90" r="3.5"/><circle cx="2306" cy="90" r="3.5"/><circle cx="2317" cy="90" r="3.5"/><circle cx="2295" cy="101" r="3.5"/><circle cx="2306" cy="101" r="3.5"/><circle cx="2295" cy="112" r="3.5"/></g>
    <path d="M2363 89 l14 14 -7 7 v-28 l7 7 -14 14" fill="none" stroke-width="3"/>
    <path d="M2418 92 a24 24 0 0 1 34 0 M2424 99 a15 15 0 0 1 22 0" fill="none" stroke-width="3.5"/>
    <circle cx="2435" cy="106" r="3.5" stroke="none"/>
    <rect x="2492" y="86" width="44" height="24" rx="7" fill="none" stroke-width="3"/>
    <rect x="2498" y="92" width="26" height="12" rx="3" stroke="none"/>
    <rect x="2538" y="94" width="4" height="8" rx="2" stroke="none"/>
    <circle cx="2592" cy="95" r="10" fill="none" stroke-width="3.5"/>
    <path d="M2600 103 l9 9" fill="none" stroke-width="4"/>
    <rect x="2638" y="84" width="34" height="13" rx="6.5" fill="none" stroke-width="3"/>
    <rect x="2638" y="101" width="34" height="13" rx="6.5" fill="none" stroke-width="3"/>
    <circle cx="2645" cy="90.5" r="3.5" stroke="none"/>
    <circle cx="2665" cy="107.5" r="3.5" stroke="none"/>
   </g>
   <text x="2984" y="108" text-anchor="end" class="clock">Fri Oct 2  11:33</text>
   <!-- the hidden items shown below the menu bar -->
   <rect x="1966" y="142" width="560" height="64" rx="20" fill="#3C8CC3" opacity="0.9"/>
   <g fill="#FFFFFF">
    <path d="M2010 186 a14 14 0 0 1 4 -27 a18 18 0 0 1 32 6 a11 11 0 0 1 -2 21z"/>
    <circle cx="2094" cy="166" r="7"/><circle cx="2085" cy="182" r="7"/><circle cx="2103" cy="182" r="7"/>
    <rect x="2140" y="158" width="14" height="32" rx="3"/><rect x="2158" y="158" width="14" height="32" rx="3"/>
    <rect x="2210" y="158" width="30" height="30" rx="7" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>
    <circle cx="2225" cy="173" r="7"/>
    <rect x="2278" y="158" width="30" height="30" rx="8"/>
    <path d="M2342 188 h40 l-6 -22 h-28z"/><circle cx="2362" cy="160" r="6"/>
    <circle cx="2430" cy="174" r="9"/>
    <path d="M2430 156 v-2 M2430 194 v-2 M2412 174 h-2 M2450 174 h-2 M2417 161 l-1 -1 M2444 188 l-1 -1 M2417 187 l-1 1 M2444 160 l-1 1" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
   </g>
   <!-- the holzBar menu -->
   <g filter="url(#menu-shadow)">
    <rect x="2218" y="248" width="628" height="468" rx="34" fill="#3E8BC2" opacity="0.55"/>
    <rect x="2232" y="262" width="600" height="440" rx="26" fill="#0B4268"/>
   </g>
   <rect x="2233.5" y="263.5" width="597" height="437" rx="24.5" fill="none" stroke="#4E9BD0" stroke-width="3" opacity="0.6"/>
   <text x="2272" y="333" class="item">holzBar Settings…</text>
   <text x="2792" y="333" text-anchor="end" class="key">⌘ ,</text>
   <rect x="2262" y="361" width="540" height="2" fill="#FFFFFF" opacity="0.14"/>
   <text x="2272" y="413" class="item">Search Menu Bar Items</text>
   <rect x="2262" y="441" width="540" height="2" fill="#FFFFFF" opacity="0.14"/>
   <text x="2272" y="493" class="item">Show Hidden Section</text>
   <rect x="2262" y="521" width="540" height="2" fill="#FFFFFF" opacity="0.14"/>
   <text x="2272" y="573" class="item">How to Update…</text>
   <rect x="2262" y="601" width="540" height="2" fill="#FFFFFF" opacity="0.14"/>
   <rect x="2273" y="629" width="26" height="26" rx="6" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.85"/>
   <path d="M2281 637 l10 10 M2291 637 l-10 10" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
   <text x="2314" y="653" class="item">Quit holzBar</text>
   <text x="2792" y="653" text-anchor="end" class="key">⌘ Q</text>
  </g>
 </g>
</svg>
