<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"><defs><clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
<filter id="tile" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.3"/></filter>
<filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0A1A3A" flood-opacity="0.35"/></filter>
<linearGradient id="woodPlank" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9A35E"/><stop offset="0.5" stop-color="#C67A3A"/><stop offset="1" stop-color="#8E4E22"/></linearGradient>
<radialGradient id="woodDisc" cx="0.45" cy="0.55" r="0.75"><stop offset="0" stop-color="#F6C98A"/><stop offset="0.55" stop-color="#D58C4A"/><stop offset="1" stop-color="#8A4520"/></radialGradient>
<linearGradient id="night" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#1D3B7A"/><stop offset="1" stop-color="#0B1838"/></linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#7EDBF5"/><stop offset="0.55" stop-color="#2D8BE0"/><stop offset="1" stop-color="#173C8C"/></linearGradient>
<linearGradient id="ice" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#C9F1FD"/><stop offset="1" stop-color="#7CCBF0"/></linearGradient>
<linearGradient id="iceDeep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8FAFF"/><stop offset="1" stop-color="#4FB2EA"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/><stop offset="1" stop-color="#BDEBFA" stop-opacity="0.35"/></linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient></defs>
<g filter="url(#tile)"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sky)"/></g>
<g clip-path="url(#sq)"><circle cx="300" cy="260" r="360" fill="#FFFFFF" opacity="0.14"/></g>
<g filter="url(#soft)">
 <!-- wooden bar -->
 <rect x="170" y="420" width="684" height="184" rx="92" fill="url(#woodPlank)"/>
 <g fill="none" stroke="#7A3A16" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round">
  <path d="M230 480 C380 465 520 495 700 474 S800 480 810 482"/><path d="M230 548 C360 560 520 532 690 552 S790 545 806 546"/>
 </g>
 <!-- items fading into ice on the left -->
 <g><rect x="250" y="476" width="70" height="72" rx="20" fill="url(#ice)" opacity="0.55"/><rect x="340" y="476" width="70" height="72" rx="20" fill="url(#ice)" opacity="0.8"/></g>
 <!-- ice cube chevron -->
 <g transform="translate(512 512)">
  <rect x="-80" y="-80" width="160" height="160" rx="34" fill="url(#ice)" stroke="#FFFFFF" stroke-width="10"/>
  <path d="M18 -36 l-40 36 40 36" fill="none" stroke="#2D8BE0" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
 </g>
 <!-- visible items on the right -->
 <g fill="#FFF6EA"><circle cx="660" cy="512" r="26"/><rect x="706" y="486" width="90" height="52" rx="14"/></g>
 <path d="M760 330 l10 28 28 10 -28 10 -10 28 -10 -28 -28 -10 28 -10z" fill="#FFFFFF"/>
</g>
<g clip-path="url(#sq)"><rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="url(#rim)" stroke-width="6"/></g>
</svg>
