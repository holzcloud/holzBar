<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Wood: a warm cross-section of a trunk -->
    <radialGradient id="wood" cx="0.46" cy="0.54" r="0.75">
      <stop offset="0" stop-color="#F6C98A"/>
      <stop offset="0.55" stop-color="#D58C4A"/>
      <stop offset="1" stop-color="#8A4520"/>
    </radialGradient>
    <!-- Frost creeping in from the top -->
    <radialGradient id="frost" cx="0.12" cy="0.08" r="0.62">
      <stop offset="0" stop-color="#F2FCFF" stop-opacity="0.7"/>
      <stop offset="0.45" stop-color="#CDEFFC" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#CDEFFC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Ice facets -->
    <linearGradient id="iceL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9F3FF"/>
      <stop offset="1" stop-color="#3FA9E8"/>
    </linearGradient>
    <linearGradient id="iceC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#8FD8F6"/>
    </linearGradient>
    <linearGradient id="iceR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FD0F4"/>
      <stop offset="1" stop-color="#1F6FC9"/>
    </linearGradient>
    <clipPath id="sq">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="crystalShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#3A1A08" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#tileShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#wood)"/>
  </g>

  <g clip-path="url(#sq)">
    <!-- Growth rings, slightly irregular like real wood -->
    <g fill="none" stroke="#7A3A16" stroke-linecap="round">
      <path d="M512 470 c40 0 68 34 66 74 c-2 42 -32 70 -70 68 c-40 -2 -66 -34 -64 -72 c2 -40 30 -70 68 -70z" stroke-opacity="0.35" stroke-width="7"/>
      <ellipse cx="506" cy="548" rx="150" ry="142" stroke-opacity="0.30" stroke-width="9" transform="rotate(-8 506 548)"/>
      <ellipse cx="502" cy="552" rx="225" ry="212" stroke-opacity="0.26" stroke-width="6" transform="rotate(6 502 552)"/>
      <ellipse cx="508" cy="556" rx="300" ry="285" stroke-opacity="0.28" stroke-width="12" transform="rotate(-4 508 556)"/>
      <ellipse cx="500" cy="560" rx="378" ry="360" stroke-opacity="0.22" stroke-width="7" transform="rotate(9 500 560)"/>
      <ellipse cx="506" cy="566" rx="460" ry="440" stroke-opacity="0.26" stroke-width="14" transform="rotate(-6 506 566)"/>
      <ellipse cx="500" cy="570" rx="545" ry="522" stroke-opacity="0.20" stroke-width="8"/>
    </g>
    <!-- Frost -->
    <rect x="100" y="100" width="824" height="824" fill="url(#frost)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="url(#rim)" stroke-width="6"/>
  </g>

  <!-- Ice crystal: an elongated hexagonal prism -->
  <g filter="url(#crystalShadow)" stroke-linejoin="round">
    <!-- left face -->
    <polygon points="512,214 420,318 420,700 512,812 470,700 470,318" fill="url(#iceL)"/>
    <!-- centre face -->
    <polygon points="512,214 470,318 470,700 512,812 554,700 554,318" fill="url(#iceC)"/>
    <!-- right face -->
    <polygon points="512,214 554,318 554,700 512,812 604,700 604,318" fill="url(#iceR)"/>
    <!-- side crystal, left -->
    <polygon points="352,430 300,488 300,690 352,752 380,690 380,488" fill="url(#iceL)"/>
    <polygon points="352,430 380,488 380,690 352,752 404,690 404,488" fill="url(#iceR)"/>
    <!-- side crystal, right -->
    <polygon points="672,470 640,520 640,700 672,750 700,700 700,520" fill="url(#iceC)"/>
    <polygon points="672,470 700,520 700,700 672,750 724,700 724,520" fill="url(#iceR)"/>
    <!-- outlines -->
    <g fill="none" stroke="#FFFFFF" stroke-width="10">
      <polygon points="512,214 604,318 604,700 512,812 420,700 420,318"/>
      <polygon points="352,430 404,488 404,690 352,752 300,690 300,488"/>
      <polygon points="672,470 724,520 724,700 672,750 640,700 640,520"/>
    </g>
  </g>
  <!-- Highlights -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none">
    <line x1="490" y1="340" x2="490" y2="560" stroke-width="12" stroke-opacity="0.8"/>
    <line x1="490" y1="600" x2="490" y2="640" stroke-width="12" stroke-opacity="0.8"/>
  </g>
  <path d="M640 236 l9 26 26 9 -26 9 -9 26 -9 -26 -26 -9 26 -9z" fill="#FFFFFF"/>
  <path d="M300 340 l6 17 17 6 -17 6 -6 17 -6 -17 -17 -6 17 -6z" fill="#FFFFFF" fill-opacity="0.9"/>
</svg>
