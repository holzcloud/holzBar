<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
 <!-- holzIce: an ice cube with the chevron, standing on the holzcloud plank. -->
 <defs>
  <filter id="tile" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.3"/></filter>
  <clipPath id="cube"><rect x="364" y="397" width="297" height="297" rx="66"/></clipPath>
  <clipPath id="plank"><rect x="207" y="702" width="610" height="107" rx="37"/></clipPath>
 </defs>
 <!-- tile: the standard macOS icon square (824 px, inset 100 px) -->
 <g filter="url(#tile)"><rect x="100" y="100" width="824" height="824" rx="185" fill="#0A1426"/></g>
 <!-- ice cube -->
 <rect x="364" y="397" width="297" height="297" rx="66" fill="#D6F3FF"/>
 <rect x="364" y="397" width="297" height="99" rx="49" fill="#FFFFFF" opacity="0.55" clip-path="url(#cube)"/>
 <!-- chevron -->
 <path d="M553 479 L463 545 L553 611" fill="none" stroke="#1C78AE" stroke-width="37" stroke-linecap="round" stroke-linejoin="round"/>
 <!-- sparkle -->
 <path d="M718 355 l12 33 33 12 -33 12 -12 33 -12 -33 -33 -12 33 -12z" fill="#FFFFFF"/>
 <!-- wooden plank -->
 <rect x="207" y="702" width="610" height="107" rx="37" fill="#C98B4F"/>
 <rect x="207" y="702" width="610" height="25" rx="12" fill="#E0A869" opacity="0.7" clip-path="url(#plank)"/>
 <g fill="none" stroke="#9B6534" stroke-linecap="round">
  <path d="M265 759 C388 743 545 780 759 755" stroke-width="10.7"/>
  <path d="M339 784 C446 772 586 792 677 780" stroke-width="8" opacity="0.7"/>
  <ellipse cx="594" cy="751" rx="25" ry="12" stroke-width="8"/>
 </g>
</svg>
